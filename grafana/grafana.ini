# Grafana 主配置（挂载覆盖镜像默认值）
[server]
http_addr = 127.0.0.1
http_port = 28300
root_url = http://127.0.0.1:28300/
serve_from_sub_path = false

[security]
admin_user = admin
# admin_password 不写在此处：由环境变量 GF_SECURITY_ADMIN_PASSWORD 注入（取自凭据服务）
disable_initial_admin_creation = false
cookie_secure = false
strict_transport_security = false

[users]
# AC2：禁止自助注册
allow_sign_up = false
allow_org_create = false
auto_assign_org = true
default_theme = dark

[auth]
disable_login_form = false

[auth.anonymous]
# AC2：关闭匿名访问
enabled = false
org_name = Main Org.
org_role = Viewer

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[news]
news_feed_enabled = false

[log]
mode = console
level = info
