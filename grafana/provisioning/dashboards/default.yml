apiVersion: 1

providers:
  - name: dnmon-dashboards
    orgId: 1
    folder: "Monitoring"
    type: file
    # false：文件被删除后 Grafana 同步删除对应面板（AC4 回退验证依赖此行为）
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
