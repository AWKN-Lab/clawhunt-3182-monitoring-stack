global:
  # 由 deploy.sh 按 SCRAPE_INTERVAL 渲染成 run/prometheus.rendered.yml 后挂载
  scrape_interval: ${SCRAPE_INTERVAL}
  evaluation_interval: 15s
  external_labels:
    stack: dnmon

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:28393"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:28390"]
        labels:
          env: dev
          role: monitoring

  - job_name: alertmanager
    static_configs:
      - targets: ["127.0.0.1:28393"]
        labels:
          env: dev
          role: monitoring

  # 节点清单由 scripts/gen_targets.sh 生成 targets/nodes.json（file_sd）
  - job_name: node
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/nodes.json
        refresh_interval: 30s

  # PostgreSQL / Redis exporter（本次为本地 mock exporter，不连生产库）
  - job_name: postgres
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/exporters.json
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [exporter]
        regex: "postgres"
        action: keep
      - target_label: instance
        replacement: mock-postgres-1

  - job_name: redis
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/exporters.json
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [exporter]
        regex: "redis"
        action: keep
      - target_label: instance
        replacement: mock-redis-1
