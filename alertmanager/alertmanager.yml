global:
  resolve_timeout: 5m

route:
  receiver: default-null
  group_by: ["alertname", "instance"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  # 本次验收不向外部发送通知；生产按客户通道替换此处
  - name: default-null

inhibit_rules:
  - source_matchers: ["severity=\"critical\""]
    target_matchers: ["severity=\"warning\""]
    equal: ["alertname", "instance"]
