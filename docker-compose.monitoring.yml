# ClawHunt #3182 监控栈 · docker compose
# 所有组件 network_mode: host，并显式只监听 127.0.0.1，公网不可达（AC3）。
# 端口段 28300-28399 已在内部端口登记表中登记。
name: dnmon

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: dnmon-prometheus
    network_mode: host
    user: root
    mem_limit: 300m
    environment:
      SCRAPE_INTERVAL: ${SCRAPE_INTERVAL:-15s}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${MONITORING_RETENTION_DAYS:-30}d
      - --storage.tsdb.retention.size=280MB
      - --web.listen-address=127.0.0.1:28390
      - --web.enable-lifecycle
    volumes:
      - ./run/prometheus.rendered.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - ./targets:/etc/prometheus/targets:ro
      - dnmon-prometheus-data:/prometheus
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: dnmon-alertmanager
    network_mode: host
    user: root
    mem_limit: 64m
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=127.0.0.1:28393
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - dnmon-alertmanager-data:/alertmanager
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: dnmon-grafana
    network_mode: host
    mem_limit: 384m
    environment:
      # 管理员口令不落盘、不硬编码：由部署脚本从凭据服务注入本进程环境
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set from credential service}
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "28300"
      GF_SERVER_ROOT_URL: http://127.0.0.1:28300/
      # AC2：关闭匿名访问与自助注册（默认 false；仅截图取证时可临时置 true）
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANON_ENABLED:-false}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_BASIC_ENABLED: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - dnmon-grafana-data:/var/lib/grafana
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: dnmon-node-exporter
    network_mode: host
    pid: host
    mem_limit: 48m
    command:
      - --path.rootfs=/host
      - --web.listen-address=127.0.0.1:28391
      - --collector.textfile
      - --collector.textfile.directory=/var/lib/node_exporter/textfile
    volumes:
      - /:/host:ro,rslave
      - ./textfile:/var/lib/node_exporter/textfile:ro
    restart: unless-stopped

volumes:
  dnmon-prometheus-data:
  dnmon-grafana-data:
  dnmon-alertmanager-data:
